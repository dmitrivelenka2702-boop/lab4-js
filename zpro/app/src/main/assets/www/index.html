<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3859D9"><title>Заступник PRO</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><small>Робочий диспетчер</small><h1>Заступник <span>PRO</span></h1></div><button class="add" onclick="quickAdd()">＋</button></header>
<div id="access" class="banner hidden"><div><b>Увімкни моніторинг листів</b><small>Для Gmail-сповіщень від ktmsg@ukr.net</small></div><button onclick="Android.openNotificationAccess()">Увімкнути</button></div><div class="banner" style="background:#fff;color:#172033;border:1px solid #e4e8f2"><div><b>Пошта / синхронізація</b><small style="color:#7b8498">Apps Script перевіряє Gmail і календарні дедлайни</small></div><button style="background:#3859D9;color:#fff" onclick="Android.openMailSync()">Відкрити</button></div>
<main>
<section class="stats"><div><small>В роботі</small><b id="stOpen">0</b></div><div><small>На 7 днів</small><b id="stWeek">0</b></div><div><small>Прострочено</small><b id="stOver">0</b></div><div><small>Закрито</small><b id="stDone">0</b></div></section>
<div class="tabs"><button class="tab active" data-f="all">Усі</button><button class="tab" data-f="urgent">Термінові</button><button class="tab" data-f="nodate">Без дати</button><button class="tab" data-f="done">Готові</button></div>
<input id="search" class="search" placeholder="Пошук за номером, темою, текстом…" oninput="renderTasks()">
<div id="tasks"></div>
</main>
<div id="modal" class="modal hidden"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script src="app.js"></script></body></html>
